<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#020204" />
    <title>♡</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020204;
      }

      body {
        display: grid;
        place-items: center;
        font-family: Georgia, serif;
      }

      #heart {
        display: block;
        width: min(96vw, 900px);
        height: min(88vh, 760px);
        height: min(88svh, 760px);
        filter: drop-shadow(0 0 9px #ff247c);
        position: relative;
        z-index: 2;
      }

      #sparkles {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      /* MUSIC PLAYER */
      .music-player {
        position: fixed;
        left: 50%;
        bottom: max(24px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 8px 17px 8px 9px;
        background: rgba(20, 9, 16, 0.9);
        border: 1px solid rgba(255, 112, 173, 0.35);
        border-radius: 40px;
        z-index: 5;
        backdrop-filter: blur(10px);
        box-shadow: 0 0 20px rgba(255, 36, 124, 0.12);
        white-space: nowrap;
      }

      .music-player button {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 50%;
        background: #ff70ad;
        color: #250817;
        font-size: 15px;
        cursor: pointer;
        flex-shrink: 0;
        -webkit-tap-highlight-color: transparent;
      }

      .music-player button:active {
        transform: scale(0.94);
      }

      .music-info {
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-family: Arial, sans-serif;
      }

      .music-title {
        color: #ffd0e2;
        font-size: 12px;
        font-weight: 600;
      }

      .music-status {
        color: #c58da7;
        font-size: 10px;
      }

      @media (max-width: 600px) {
        #heart {
          width: 96vw;
          height: 76vh;
          height: 76svh;
        }

        .music-player {
          bottom: max(20px, env(safe-area-inset-bottom));
        }
      }

      @media (max-height: 450px) {
        #heart {
          height: 78vh;
        }

        .music-player {
          bottom: 8px;
        }
      }
    </style>
  </head>

  <body>
    <canvas
      id="heart"
      aria-label="Animasi hati pink dengan tulisan I love you"
    ></canvas>

    <canvas id="sparkles" aria-hidden="true"></canvas>

    <!-- PEMUTAR MUSIK -->
    <div class="music-player">
      <button id="musicButton" type="button" aria-label="Putar musik">▶</button>

      <div class="music-info">
        <span class="music-title">Until I Found You</span>
        <span class="music-status" id="musicStatus">Tap to play</span>
      </div>
    </div>

    <audio id="bgMusic" loop preload="auto">
      <source src="./lagu.mpeg" type="audio/mpeg" />
    </audio>

    <script>
      // ==============================
      // ANIMASI HATI
      // ==============================

      const canvas = document.getElementById("heart");
      const ctx = canvas.getContext("2d");

      let w = 0;
      let h = 0;
      let dpr = 1;
      let points = [];
      let progress = 0;
      let last = 0;

      function curve(t) {
        return {
          x: 16 * Math.sin(t) ** 3,
          y: -(
            13 * Math.cos(t) -
            5 * Math.cos(2 * t) -
            2 * Math.cos(3 * t) -
            Math.cos(4 * t)
          ),
        };
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        const r = canvas.getBoundingClientRect();

        w = r.width;
        h = r.height;

        canvas.width = w * dpr;
        canvas.height = h * dpr;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        makePoints();
      }

      function makePoints() {
        points = [];

        const scale = Math.min(w / 38, h / 34) * 0.82;
        const count = 320;

        for (let i = 0; i < count; i++) {
          const t = (i / count) * Math.PI * 2;
          const p = curve(t);

          points.push({
            x: w / 2 + p.x * scale,
            y: h / 2 - 24 + p.y * scale,
            phase: Math.random() * Math.PI * 2,
            size: 0.75 + Math.random() * 0.8,
          });
        }
      }

      // DETAK JANTUNG
      function heartbeat(ts) {
        const beat = (ts % 1100) / 1100;

        const first = Math.exp(-Math.pow((beat - 0.12) / 0.035, 2));
        const second = Math.exp(-Math.pow((beat - 0.22) / 0.045, 2));

        return 1 + first * 0.025 + second * 0.012;
      }

      // ==============================
      // PARTIKEL BACKGROUND
      // ==============================

      const sparkleCanvas = document.getElementById("sparkles");
      const sctx = sparkleCanvas.getContext("2d");

      let sw = 0;
      let sh = 0;
      let sparkles = [];

      function resizeSparkles() {
        const d = Math.min(window.devicePixelRatio || 1, 2);

        sw = window.innerWidth;
        sh = window.innerHeight;

        sparkleCanvas.width = sw * d;
        sparkleCanvas.height = sh * d;

        sctx.setTransform(d, 0, 0, d, 0, 0);

        const amount = Math.min(
          100,
          Math.max(45, Math.floor((sw * sh) / 11000)),
        );

        sparkles = Array.from({ length: amount }, () => ({
          x: Math.random() * sw,
          y: Math.random() * sh,
          r: 0.5 + Math.random() * 1.5,
          p: Math.random() * Math.PI * 2,
          s: 0.3 + Math.random() * 0.7,
          vx: (Math.random() - 0.5) * 0.12,
          vy: -0.04 - Math.random() * 0.12,
        }));
      }

      function drawSparkles(ts, dt) {
        sctx.clearRect(0, 0, sw, sh);

        for (const a of sparkles) {
          a.x += a.vx * dt * 60;
          a.y += a.vy * dt * 60;

          if (a.y < -5) {
            a.y = sh + 5;
            a.x = Math.random() * sw;
          }

          if (a.x < -5) a.x = sw + 5;
          if (a.x > sw + 5) a.x = -5;

          const tw = (Math.sin(ts * 0.001 * a.s + a.p) + 1) / 2;

          sctx.globalAlpha = 0.12 + tw * 0.6;
          sctx.fillStyle = tw > 0.82 ? "#fff0f8" : "#ff70ad";
          sctx.shadowColor = "#ff3d91";
          sctx.shadowBlur = tw * 10;

          sctx.beginPath();
          sctx.arc(a.x, a.y, a.r * (0.7 + tw * 0.6), 0, Math.PI * 2);
          sctx.fill();

          if (tw > 0.94) {
            sctx.globalAlpha = 0.4;
            sctx.fillRect(a.x - 3, a.y - 0.35, 6, 0.7);
            sctx.fillRect(a.x - 0.35, a.y - 3, 0.7, 6);
          }
        }

        sctx.globalAlpha = 1;
        sctx.shadowBlur = 0;
      }

      // ==============================
      // ANIMASI UTAMA
      // ==============================

      function frame(ts) {
        if (!last) last = ts;

        const dt = Math.min((ts - last) / 1000, 0.05);
        last = ts;

        progress += dt * 0.16;

        if (progress > 1.75) {
          progress = -0.18;
        }

        ctx.clearRect(0, 0, w, h);

        drawSparkles(ts, dt);

        const pulse = heartbeat(ts);

        points.forEach((p, i) => {
          const start = i / points.length;

          const reveal = Math.max(0, Math.min(1, (progress - start) * 8));

          if (reveal <= 0) return;

          const twinkle = 0.6 + 0.4 * Math.sin(ts * 0.002 + p.phase);

          const x = w / 2 + (p.x - w / 2) * pulse;
          const y = h / 2 - 24 + (p.y - (h / 2 - 24)) * pulse;

          ctx.beginPath();
          ctx.arc(x, y, p.size * (0.75 + twinkle * 0.5), 0, Math.PI * 2);

          ctx.fillStyle = `rgba(
          255,
          ${80 + Math.floor(twinkle * 55)},
          ${150 + Math.floor(twinkle * 75)},
          ${reveal * (0.55 + twinkle * 0.45)}
        )`;

          ctx.shadowBlur = 7 + twinkle * 7;
          ctx.shadowColor = "#ff287f";

          ctx.fill();
        });

        ctx.shadowBlur = 0;

        // TULISAN I LOVE YOU
        const textAlpha = Math.max(0, Math.min(1, (progress - 1.02) * 3));

        if (textAlpha > 0) {
          const size = Math.min(w * 0.085, 42);

          ctx.save();

          ctx.globalAlpha = textAlpha * (0.82 + 0.18 * Math.sin(ts * 0.003));

          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.font = `italic ${size}px Georgia, serif`;

          ctx.shadowColor = "#ff287f";
          ctx.shadowBlur = 18;
          ctx.fillStyle = "#ffd0e2";

          ctx.fillText("I love you", w / 2, h / 2 + 5);

          ctx.restore();
        }

        requestAnimationFrame(frame);
      }

      // RESPONSIF
      const observer = new ResizeObserver(resize);
      observer.observe(canvas);

      window.addEventListener("resize", resizeSparkles);

      resizeSparkles();
      resize();

      requestAnimationFrame(frame);

      // ==============================
      // MUSIK
      // ==============================

      const music = document.getElementById("bgMusic");
      const musicButton = document.getElementById("musicButton");
      const musicStatus = document.getElementById("musicStatus");

      music.volume = 0.5;

      function updateMusicButton() {
        if (music.paused) {
          musicButton.textContent = "▶";
          musicStatus.textContent = "Tap to play";
          musicButton.setAttribute("aria-label", "Putar musik");
        } else {
          musicButton.textContent = "Ⅱ";
          musicStatus.textContent = "Now playing";
          musicButton.setAttribute("aria-label", "Jeda musik");
        }
      }

      function playMusic() {
        music
          .play()
          .then(updateMusicButton)
          .catch(() => {
            updateMusicButton();
          });
      }

      musicButton.addEventListener("click", () => {
        if (music.paused) {
          playMusic();
        } else {
          music.pause();
        }
      });

      music.addEventListener("play", updateMusicButton);
      music.addEventListener("pause", updateMusicButton);

      // COBA AUTOPLAY
      window.addEventListener("load", () => {
        playMusic();
      });

      // COBA PUTAR SAAT PENGGUNA MENYENTUH LAYAR
      document.addEventListener("pointerdown", (event) => {
        if (music.paused && !musicButton.contains(event.target)) {
          playMusic();
        }
      });

      updateMusicButton();
    </script>
  </body>
</html>
